<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTTP Range Lab</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell"><header><p class="eyebrow">HTTP PROTOCOL PLAYGROUND</p><h1>HTTP Range Lab</h1><p>Simulate a byte-range request against a resource of a chosen size.</p></header><section class="panel"><label>Resource size (bytes)<input id="size" type="number" min="0" value="1000"></label><label>Range header<input id="range" value="bytes=100-199" spellcheck="false"></label><button id="run">Simulate response</button></section><section class="panel"><h2>Response</h2><div id="status" class="status">Ready</div><dl><dt>Content-Range</dt><dd id="content-range">—</dd><dt>Selected bytes</dt><dd id="selected">—</dd><dt>Response length</dt><dd id="length">—</dd></dl><div id="bar" class="bar"><span></span></div><p id="message" class="muted">Try bytes=0-99, bytes=500-, or bytes=-64.</p></section></main><script type="module" src="/app.js"></script></body></html>
